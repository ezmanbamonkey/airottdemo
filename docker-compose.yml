services:
  postgres:
    image: postgres:16-alpine
    container_name: web-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webplatform
      POSTGRES_PASSWORD: webplatform
      POSTGRES_DB: webplatform
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webplatform -d webplatform']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
